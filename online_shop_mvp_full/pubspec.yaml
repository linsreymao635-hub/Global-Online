name: online_shop_mvp_full
description: Complete beginner online shopping app using MVP architecture.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.3
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  google_sign_in: ^7.2.0
  webview_flutter: ^4.14.1
  record: ^7.1.1
  audioplayers: ^6.8.1
  video_player: ^2.14.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/image.png
